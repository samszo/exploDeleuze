<meta charset="utf-8">
<title>Flux Conceptuel Auto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0f1216;
  --panel-line:rgba(148,188,227,.16);
  --line-soft:rgba(148,188,227,.14);
  --line:rgba(148,188,227,.24);
  --line-strong:rgba(148,188,227,.4);
  --text:#e8ecf0;
  --text-dim:#8fa0b0;
  --label:#94bce3;
  --wire:#5d7893;
  --steel:#5980a6;
  --steel-hover:#749dc4;
  --steel-wash:rgba(148,188,227,.12);
  --gold:#e8c15a;
  --gold-wash:rgba(232,193,90,.1);
  --gold-wash-2:rgba(232,193,90,.22);
  --bad:#c96a5a;
  --font-head:"Barlow Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--steel-hover);outline-offset:2px}
::selection{background:var(--gold-wash-2)}

.letterbox{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
.stage{
  position:absolute;top:50%;left:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%);transform-origin:center center;
  background:var(--bg);display:flex;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.rail{flex:none;width:96px;background:#12171d;border-right:1px solid var(--panel-line);
  display:flex;flex-direction:column;align-items:stretch;padding:14px 0;gap:4px}
.rail-logo{height:34px;display:flex;align-items:center;justify-content:center;color:var(--gold);
  font:600 15px var(--font-head);letter-spacing:.14em}
.rail-btn{appearance:none;border:0;background:transparent;color:var(--text-dim);height:76px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;font:400 10px var(--font-body);letter-spacing:.06em}
.rail-btn.active{background:var(--steel-wash);color:var(--label)}
.rail-spacer{flex:1}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.header{flex:none;height:56px;display:flex;align-items:center;gap:18px;padding:0 26px;
  border-bottom:1px solid var(--panel-line);background:#12171d}
.crumb{font:600 17px var(--font-head);letter-spacing:.06em;color:var(--text);text-transform:uppercase}
.crumb-sub{font:400 13px var(--font-body);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-fill{flex:1}
.header-meta{font:400 13px var(--font-body);color:var(--text-dim);white-space:nowrap}
.header-div{width:1px;height:18px;background:var(--line)}
.clock{font:600 17px var(--font-head);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wire);flex:none}
.dot.up{background:#7fae7a}
.dot.down{background:var(--bad)}

.main{flex:1;min-height:0;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;animation:screenin .18s ease-out}
@keyframes screenin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

.eyebrow{font:600 11px var(--font-body);letter-spacing:.16em;color:var(--label);text-transform:uppercase}
.empty{color:var(--text-dim);font:400 15px var(--font-body);padding:20px 2px}

.blueprint{position:relative}
.corner{position:absolute;width:11px;height:11px;
  background:linear-gradient(var(--wire),var(--wire)) 5px 0/1px 100% no-repeat,
    linear-gradient(var(--wire),var(--wire)) 0 5px/100% 1px no-repeat}
.corner.tl{top:-6px;left:-6px}.corner.tr{top:-6px;right:-6px}
.corner.bl{bottom:-6px;left:-6px}.corner.br{bottom:-6px;right:-6px}

.btn-primary{appearance:none;border:0;background:var(--steel);color:#0f1216;cursor:pointer;
  font:600 20px var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.btn-primary:hover,.btn-primary:active{background:var(--steel-hover)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-outline{appearance:none;background:transparent;border:1px solid var(--line-strong);color:#cfe0ef;
  cursor:pointer;font:600 15px var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.btn-outline:hover,.btn-outline:active{background:var(--steel-wash)}

.home{position:absolute;inset:0;display:flex;gap:26px;padding:26px 26px 0}
.home-left{flex:none;width:452px;display:flex;flex-direction:column;gap:20px}
.resume-card{border:1px solid var(--line);padding:24px 22px 22px}
.title-lg{font:600 34px/1.05 var(--font-head);color:var(--text);margin:10px 0 6px;text-wrap:balance}
.meta{font:400 16px var(--font-body);color:var(--text-dim)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.tag{font:400 13px var(--font-body);color:#cfe0ef;border:1px solid var(--line-strong);padding:5px 10px}
.resume-card .btn-primary{width:100%;height:64px}
.topo-card{border:1px solid var(--line);padding:18px 20px}
.title-md{font:600 26px/1.1 var(--font-head);color:var(--text);margin:12px 0 0}
.topo-card .meta{margin-top:6px;font-size:15px}
.topo-card .btn-outline{margin-top:14px;height:52px;padding:0 20px}
.home-right{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:6px}
.home-right>.eyebrow{margin-bottom:12px}
.theme-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.theme-row{appearance:none;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line-soft);padding:16px 14px;display:flex;align-items:center;
  gap:16px;cursor:pointer}
.theme-row:hover,.theme-row:active{background:rgba(148,188,227,.08)}
.theme-n{font:600 14px var(--font-head);color:var(--wire);width:26px;flex:none}
.theme-info{flex:1;min-width:0;text-align:left}
.theme-name{display:block;font:600 25px/1.1 var(--font-head);color:var(--text)}
.theme-meta{display:block;font:400 14px var(--font-body);color:var(--text-dim);margin-top:3px}
.chevron{font:400 22px var(--font-body);color:var(--wire);flex:none}

.detail{position:absolute;inset:0;padding:26px;display:flex;gap:26px}
.detail-left{flex:1;min-width:0;display:flex;flex-direction:column}
.btn-back{height:44px;padding:0 16px;flex:none;align-self:flex-start}
.title-xl{font:600 46px/1.05 var(--font-head);color:var(--text);margin:22px 0 8px;text-wrap:balance}
.detail-left>.meta{font-size:17px}
.seance-list{flex:1;min-height:0;overflow:auto;margin-top:20px;display:flex;flex-direction:column;gap:2px}
.seance-row{appearance:none;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line-soft);padding:14px;display:flex;align-items:center;gap:16px;cursor:pointer}
.seance-row:hover,.seance-row:active{background:rgba(148,188,227,.08)}
.seance-n{font:600 15px var(--font-head);color:var(--wire);width:28px;flex:none}
.seance-info{flex:1;min-width:0}
.seance-date{display:block;font:600 20px var(--font-head);color:var(--text)}
.seance-meta{display:block;font:400 13px var(--font-body);color:var(--text-dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seance-frag{font:400 14px var(--font-body);color:var(--text-dim);flex:none}

.map{position:absolute;inset:0;display:flex}
.map-canvas{flex:1;min-width:0;position:relative;margin:26px 0 26px 26px;border:1px solid var(--line);
  background:radial-gradient(circle at 46% 44%,rgba(89,128,166,.18),transparent 62%);overflow:hidden}
.map-node{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(148,188,227,.5);
  background:#12171d;padding:11px 15px;font:600 20px var(--font-head);color:var(--text);white-space:nowrap;
  cursor:pointer;appearance:none}
.map-node:hover{background:#182531}
.map-node.hub{border-color:var(--gold);background:#1d1a12;color:var(--gold);cursor:default;font-size:24px}
.map-node.new{border-color:var(--gold);background:#1d1a12;color:var(--gold);animation:pulse 2.4s ease-in-out 3}
@keyframes pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.map-node.new{animation:none}}
.map-legend{position:absolute;left:16px;bottom:14px;font:400 12px var(--font-body);color:var(--wire);letter-spacing:.08em}
.map-search{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:0;
  border:1px solid var(--line-strong);background:#12171d}
.map-search input{width:280px;background:transparent;border:0;color:var(--text);font:400 15px var(--font-body);
  padding:10px 14px;outline:0}
.map-search button{appearance:none;border:0;border-left:1px solid var(--line-strong);background:transparent;
  color:var(--label);font:600 13px var(--font-head);letter-spacing:.08em;padding:0 16px;cursor:pointer}
.map-side{flex:none;width:372px;padding:26px;display:flex;flex-direction:column;gap:16px}
.map-side .title-md{font-size:32px;margin-top:8px;text-wrap:balance}
.map-side .meta{margin-top:5px;font-size:15px}
.map-log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.log-row{padding:12px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px}
.log-text{font:400 15px/1.4 var(--font-body);color:var(--text)}
.log-w{font:400 13px var(--font-body);color:var(--wire);flex:none}
.map-actions{display:flex;gap:10px}
.map-actions button{flex:1;height:56px;font-size:15px}

.search{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;gap:18px}
.search-bar{display:flex;align-items:center;gap:16px;border:1px solid var(--line-strong);padding:0 20px;height:72px}
.search-bar svg{flex:none}
.search-bar input{flex:1;background:transparent;border:0;outline:0;font:400 26px var(--font-body);color:var(--text)}
.search-bar input::placeholder{color:var(--text-dim)}
.search-bar button{appearance:none;border:0;background:transparent;color:var(--label);cursor:pointer;
  font:600 14px var(--font-head);letter-spacing:.1em}
.search-count{font:400 14px var(--font-body);color:var(--text-dim)}
.search-results{flex:1;min-height:0;overflow:auto}
.result-row{appearance:none;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line-soft);padding:16px 12px;display:flex;gap:18px;
  align-items:flex-start;cursor:pointer}
.result-row:hover,.result-row:active{background:rgba(148,188,227,.08)}
.result-tc{flex:none;width:78px;font:600 15px var(--font-head);color:var(--gold);letter-spacing:.06em;padding-top:3px;font-variant-numeric:tabular-nums}
.result-body{flex:1;min-width:0;text-align:left}
.result-course{display:block;font:600 19px var(--font-head);color:var(--label)}
.result-excerpt{display:block;font:400 16px/1.45 var(--font-body);color:#cfe0ef;margin-top:4px}
.result-excerpt em{color:var(--gold);font-style:normal}

.player{position:absolute;inset:0;display:flex;flex-direction:column;padding:26px}
.player-title-row{display:flex;align-items:baseline;gap:14px}
.player-title-row .title-md{margin:0;font-size:28px}
.player-title-row .meta{font-size:15px}
.transcript{position:relative;flex:1;min-height:0;margin:20px 0 22px;border:1px solid var(--line);
  padding:32px 34px;overflow:auto}
.transcript-text{font:400 30px/1.55 var(--font-body);color:#7c8b99;text-wrap:pretty}
.word{transition:color .15s}
.word.future{color:#7c8b99}
.word.active{color:var(--gold)}
.word.past{color:var(--text)}
.progress{height:4px;background:rgba(148,188,227,.2);position:relative;cursor:pointer}
.progress-fill{height:4px;background:var(--gold);pointer-events:none}
.player-controls{display:flex;align-items:center;gap:26px;margin-top:18px}
.player-clock{font:400 15px var(--font-body);color:var(--text-dim);width:130px;font-variant-numeric:tabular-nums}
.transport{flex:1;display:flex;justify-content:center;gap:14px}
.transport-btn{appearance:none;width:64px;height:64px;border:1px solid var(--line-strong);background:transparent;
  color:#cfe0ef;font:400 20px var(--font-body);cursor:pointer}
.transport-btn:disabled{opacity:.3;cursor:default}
.transport-btn:hover:not(:disabled),.transport-btn:active:not(:disabled){background:var(--steel-wash)}
.play-btn{appearance:none;width:88px;height:64px;border:0;background:var(--steel);color:#0f1216;
  font:600 20px var(--font-head);letter-spacing:.08em;cursor:pointer}
.play-btn:hover,.play-btn:active{background:var(--steel-hover)}
.side-actions{width:220px;display:flex;justify-content:flex-end;gap:10px}
.side-btn{appearance:none;height:56px;padding:0 18px;border:1px solid var(--line);background:transparent;
  color:var(--text-dim);font:400 14px var(--font-body);cursor:pointer}
.side-btn:hover,.side-btn:active{background:var(--steel-wash)}

.history{position:absolute;inset:0;padding:26px;display:flex;gap:26px}
.history-col{flex:1;min-width:0;display:flex;flex-direction:column}
.history-col+.history-col{border-left:1px solid var(--panel-line);padding-left:24px}
.history-col>.eyebrow{margin-bottom:14px}
.topo-list{display:flex;flex-direction:column;gap:12px;overflow:auto}
.topo-row{appearance:none;text-align:left;background:transparent;border:1px solid var(--line);
  padding:16px 18px;cursor:pointer}
.topo-row:hover,.topo-row:active{background:rgba(148,188,227,.08)}
.topo-name{display:block;font:600 26px var(--font-head);color:var(--text)}
.topo-meta{display:block;font:400 14px var(--font-body);color:var(--text-dim);margin-top:4px}
.recent-list{flex:1;min-height:0;overflow:auto}
.recent-row{appearance:none;width:100%;text-align:left;background:transparent;border:0;display:flex;gap:16px;padding:14px 0;
  border-bottom:1px solid var(--line-soft);cursor:pointer}
.recent-row:hover,.recent-row:active{background:rgba(148,188,227,.06)}
.recent-tc{flex:none;width:78px;font:600 14px var(--font-head);color:var(--wire);font-variant-numeric:tabular-nums}
.recent-course{flex:1;font:400 16px var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-when{font:400 14px var(--font-body);color:var(--text-dim);flex:none}

.settings{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;gap:2px;max-width:860px}
.setting-row{display:flex;align-items:center;gap:20px;padding:20px 4px;border-bottom:1px solid var(--line-soft)}
.setting-text{flex:1}
.setting-label{display:block;font:600 24px var(--font-head);color:var(--text)}
.setting-hint{display:block;font:400 14px var(--font-body);color:var(--text-dim);margin-top:2px}
.setting-val{font:400 15px var(--font-body);color:var(--label)}
.seg{flex:none;display:flex;border:1px solid var(--line-strong)}
.seg-opt{padding:12px 18px;font:400 15px var(--font-body);color:var(--text-dim);appearance:none;background:transparent;border:0;cursor:pointer}
.seg-opt.active{color:#0f1216;background:var(--steel)}

.footer{flex:none;height:92px;border-top:1px solid var(--panel-line);background:#12171d;
  display:flex;align-items:center;gap:22px;padding:0 26px}
.mic-btn{appearance:none;flex:none;width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);
  background:var(--gold-wash);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic-btn:hover,.mic-btn.listening{background:var(--gold-wash-2)}
.mic-btn.unsupported{border-color:var(--wire);color:var(--wire);background:transparent}
.mic-info{flex:1;min-width:0}
.mic-state{font:400 12px var(--font-body);letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase}
.mic-hint{font:400 20px var(--font-body);color:var(--text);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbars{flex:none;display:flex;align-items:flex-end;gap:4px;height:34px}
.vbar{width:4px;height:34px;background:#2c3945;transform-origin:bottom;animation:vbar 1.1s ease-in-out infinite}
.vbar.on{background:var(--gold)}
@keyframes vbar{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.vbar{animation:none;transform:scaleY(.6)}}

.listen-overlay{position:absolute;inset:0;background:rgba(10,12,15,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:10;padding:0 40px;text-align:center}
.listen-overlay.show{display:flex}
.listen-bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.listen-bar{width:7px;height:110px;background:var(--gold);transform-origin:bottom;animation:vbar .95s ease-in-out infinite}
.listen-label{font:400 12px var(--font-body);letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase}
.listen-heard{max-width:900px;text-align:center;font:600 42px/1.2 var(--font-head);color:var(--text);text-wrap:pretty}
.listen-hint{font:400 16px var(--font-body);color:var(--wire)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important}}

.rotate-hint{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);
  flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px}
@media (orientation:portrait){.rotate-hint{display:flex}.letterbox{visibility:hidden}}
.rotate-icon{width:56px;height:56px;border:2px solid var(--wire);border-radius:6px;animation:rotphone 1.8s ease-in-out infinite}
@keyframes rotphone{0%,15%{transform:rotate(0deg)}45%,100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.rotate-icon{animation:none}}
.rotate-title{font:600 22px var(--font-head);letter-spacing:.06em;color:var(--text);text-transform:uppercase}
.rotate-sub{font:400 15px/1.5 var(--font-body);color:var(--text-dim);max-width:320px}
</style>

<div class="rotate-hint">
  <div class="rotate-icon"></div>
  <div class="rotate-title">Tournez le téléphone</div>
  <div class="rotate-sub">Flux Conceptuel Auto est conçu pour l'écran large de la voiture, en orientation paysage.</div>
</div>
<div class="letterbox">
  <div class="stage" id="stage">
    <nav class="rail" id="rail">
      <div class="rail-logo">FC</div>
    </nav>
    <div class="col">
      <header class="header">
        <span class="crumb" id="crumb"></span>
        <span class="crumb-sub" id="crumbSub"></span>
        <div class="header-fill"></div>
        <span class="dot" id="apiDot" title="état de l'API"></span>
        <span class="header-meta" id="apiLabel">API</span>
        <span class="header-div"></span>
        <span class="clock" id="clock"></span>
      </header>
      <main class="main" id="main"></main>
      <footer class="footer">
        <button class="mic-btn" id="micBtn" data-action="mic" aria-label="Parler">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
        </button>
        <div class="mic-info">
          <div class="mic-state" id="micState"></div>
          <div class="mic-hint" id="micHint"></div>
        </div>
        <div class="vbars" id="vbars"></div>
      </footer>
    </div>
    <div class="listen-overlay" id="listenOverlay">
      <div class="listen-bars" id="listenBars"></div>
      <div class="listen-label" id="listenLabel"></div>
      <div class="listen-heard" id="listenHeard"></div>
      <div class="listen-hint" id="listenHint">« agence X avec Y » · « ouvre [thème] » · « cherche [mots] »</div>
    </div>
  </div>
</div>
<audio id="audioEl" preload="auto"></audio>

<script>
(function(){
"use strict";

var CORNERS = '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad2(n){return String(n).padStart(2,"0");}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec||0));var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return pad2(h)+":"+pad2(m)+":"+pad2(s);}
function nowTime(){var d=new Date();return pad2(d.getHours())+":"+pad2(d.getMinutes());}

// ---------- API ----------
async function api(path){
  var r = await fetch(path);
  if (!r.ok) throw new Error(path+" -> "+r.status);
  return r.json();
}

// ---------- stockage local (pas de compte utilisateur côté API) ----------
var LS = {recent:"fc_recent", topos:"fc_topos"};
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || "[]"); }catch(e){ return []; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v.slice(0,40))); }catch(e){} }
function pushRecent(entry){
  var list = lsGet(LS.recent).filter(function(r){return r.id !== entry.id;});
  list.unshift(entry);
  lsSet(LS.recent, list);
  state.recent = list;
}
function pushTopo(entry){
  var list = lsGet(LS.topos).filter(function(t){return t.concept !== entry.concept;});
  list.unshift(entry);
  lsSet(LS.topos, list);
  state.topos = list;
}

  home:'<path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M9.5 20v-6h5v6"></path>',
  map:'<circle cx="6" cy="7" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="12" cy="18" r="2.5"></circle><path d="M8 8.5 10.6 15.8M16.4 8.2 13.6 16"></path>',
  search:'<circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path>',
  player:'<path d="M4 12h2.5l2-5 3 12 3-9 2 3H20"></path>',
  history:'<circle cx="12" cy="12" r="8"></circle><path d="M12 7.5V12l3.5 2"></path>',
  settings:'<circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path>'
};
var RAIL = [["home","Accueil"],["map","Topologie"],["search","Recherche"],["player","Écoute"],["history","Historique"]];
var TITLES = {home:"Accueil", detail:"Thème", map:"Topologie", search:"Recherche", player:"Écoute", history:"Historique", settings:"Réglages"};

var audioEl = document.getElementById("audioEl");

var state = {
  screen: "home",
  apiOk: null,
  themes: [],
  currentTheme: null,
  seances: [],
  seance: null,        // séance ouverte : {..., fragments:[...]}
  fragIndex: 0,
  playing: false,
  searchQuery: "",
  searchResults: null,
  searchTotal: 0,
  topologyConcept: null,
  topology: null,
  topoExtra: null,      // {label} — nœud ajouté côté client par la voix ("agence X avec Y")
  listening: 0,         // 0 idle · 1 écoute · 2 traitement
  heardText: "",
  recent: lsGet(LS.recent),
  topos: lsGet(LS.topos),
};

function currentFragment(){
  if (!state.seance || !state.seance.fragments) return null;
  return state.seance.fragments[state.fragIndex] || null;
}

function svgIcon(name){
  return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+ICONS[name]+'</svg>';
}

// ---------- rendu chrome ----------
function renderRail(){
  var active = state.screen === "detail" ? "home" : state.screen;
  var html = '<div class="rail-logo">FC</div>';
  RAIL.forEach(function(r){
    html += '<button class="rail-btn'+(active===r[0]?' active':'')+'" data-action="nav:'+r[0]+'">'+svgIcon(r[0])+'<span>'+r[1]+'</span></button>';
  });
  html += '<div class="rail-spacer"></div>';
  html += '<button class="rail-btn'+(active==="settings"?' active':'')+'" data-action="nav:settings">'+svgIcon("settings")+'<span>Réglages</span></button>';
  document.getElementById("rail").innerHTML = html;
}

function renderHeader(){
  var subs = {
    home: state.themes.length ? state.themes.length + " thèmes · Gilles Deleuze" : "connexion…",
    detail: state.currentTheme ? state.seances.length + " séances" : "",
    map: state.topologyConcept || "aucun concept sélectionné",
    search: state.searchQuery ? state.searchTotal + " résultats" : "plein texte",
    player: state.seance ? state.seance.titre : "",
    history: "topologies & fragments enregistrés",
    settings: location.host
  };
  document.getElementById("crumb").textContent = TITLES[state.screen];
  document.getElementById("crumbSub").textContent = subs[state.screen] || "";
  document.getElementById("clock").textContent = nowTime();
  var dot = document.getElementById("apiDot");
  dot.className = "dot " + (state.apiOk===true?"up":state.apiOk===false?"down":"");
  document.getElementById("apiLabel").textContent = state.apiOk===false ? "API hors-ligne" : "API";
}

// ---------- écrans ----------
function screenHome(){
  var recent = state.recent[0];
  var resumeHtml;
  if (recent){
    resumeHtml =
      '<div class="blueprint resume-card">'+CORNERS+
        '<div class="eyebrow">Reprendre · '+esc(recent.timecode||"")+'</div>'+
        '<div class="title-lg">'+esc(recent.conf_theme||"")+'</div>'+
        '<div class="meta">'+esc(recent.conf_titre||"")+'</div>'+
        '<button class="btn-primary" data-action="resume-recent">Écouter la suite</button>'+
      '</div>';
  } else {
    resumeHtml =
      '<div class="blueprint resume-card">'+CORNERS+
        '<div class="eyebrow">Bienvenue</div>'+
        '<div class="title-lg">Choisissez un thème</div>'+
        '<div class="meta">Aucun fragment écouté pour l\'instant — la voix ou la liste ci-contre pour commencer.</div>'+
      '</div>';
  }
  var topoHtml = state.topologyConcept
    ? '<div class="topo-card"><div class="eyebrow">Dernière topologie</div>'+
      '<div class="title-md">'+esc(state.topologyConcept)+'</div>'+
      '<div class="meta">'+(state.topology ? state.topology.nodes.length+' concepts · '+state.topology.edges.length+' agencements' : '')+'</div>'+
      '<button class="btn-outline" data-action="nav:map">Ouvrir la carte</button></div>'
    : '<div class="topo-card"><div class="eyebrow">Topologie</div>'+
      '<div class="title-md">Aucune exploration</div>'+
      '<div class="meta">Dites « agence X avec Y » ou ouvrez un fragment</div>'+
      '<button class="btn-outline" data-action="nav:map">Ouvrir la carte</button></div>';

  var list = state.themes.length
    ? state.themes.map(function(t,i){
        return '<button class="theme-row" data-action="open-theme:'+encodeURIComponent(t.theme)+'">'+
          '<span class="theme-n">'+pad2(i+1)+'</span>'+
          '<span class="theme-info"><span class="theme-name">'+esc(t.theme)+'</span>'+
          '<span class="theme-meta">'+t.seance_count+' séances</span></span>'+
          '<span class="chevron">›</span></button>';
      }).join("")
    : '<div class="empty">'+(state.apiOk===false ? "Impossible de joindre l'API — voir Réglages." : "Chargement des thèmes…")+'</div>';

  return '<div class="screen home">'+
    '<div class="home-left">'+resumeHtml+topoHtml+'</div>'+
    '<div class="home-right"><div class="eyebrow">Cours par thème</div>'+
      '<div class="theme-list">'+list+'</div>'+
    '</div></div>';
}

function screenDetail(){
  var theme = state.currentTheme;
  var list = state.seances.map(function(s){
    return '<button class="seance-row" data-action="open-seance:'+s.id+'">'+
      '<span class="seance-n">'+pad2(s.num)+'</span>'+
      '<span class="seance-info"><span class="seance-date">'+esc(s.date||"")+'</span>'+
      '<span class="seance-meta">'+esc(s.titre||"")+'</span></span>'+
      '<span class="seance-frag">'+(s.frag_count!=null?s.frag_count+' fr.':'')+'</span></button>';
  }).join("");
  return '<div class="screen detail">'+
    '<div class="detail-left">'+
      '<button class="btn-outline btn-back" data-action="nav:home">‹ Tous les thèmes</button>'+
      '<div class="title-xl">'+esc(theme)+'</div>'+
      '<div class="meta">'+state.seances.length+' séances</div>'+
      '<div class="seance-list">'+(list || '<div class="empty">Aucune séance</div>')+'</div>'+
    '</div></div>';
}

function screenMap(){
  var data = state.topology;
  var conceptVal = esc(state.topologyConcept || "");
  if (!data){
    return '<div class="screen map">'+
      '<div class="blueprint map-canvas">'+CORNERS+
        '<div class="map-search"><input id="mapInput" placeholder="chercher un concept…" value="'+conceptVal+'">'+
        '<button data-action="map-go">EXPLORER</button></div>'+
        '<div class="map-legend" style="left:50%;bottom:auto;top:60%;transform:translateX(-50%);text-align:center">'+
        (state.topologyConcept ? 'Aucun résultat pour ce concept' : 'Tapez un concept, ou dites « agence X avec Y »')+
        '</div>'+
      '</div><div class="map-side"></div></div>';
  }
  var hub = data.concept;
  var nonHub = data.nodes.filter(function(n){return !n.hub;});
  var n = nonHub.length || 1;
  var nodesHtml = '<button class="map-node hub" style="left:50%;top:50%">'+esc(hub)+'</button>';
  var R = 240;
  nonHub.forEach(function(node,i){
    var angle = (i / n) * 2*Math.PI - Math.PI/2;
    var x = 50 + (R*Math.cos(angle))/6.4;
    var y = 50 + (R*Math.sin(angle))/3.6;
    var isNew = state.topoExtra && state.topoExtra.label === node.label;
    nodesHtml += '<button class="map-node'+(isNew?' new':'')+'" style="left:'+x+'%;top:'+y+'%" data-action="map-recenter:'+encodeURIComponent(node.label)+'">'+esc(node.label)+'</button>';
  });
  if (state.topoExtra && !nonHub.some(function(n){return n.label===state.topoExtra.label;})){
    nodesHtml += '<button class="map-node new" style="left:50%;top:14%" data-action="map-recenter:'+encodeURIComponent(state.topoExtra.label)+'">'+esc(state.topoExtra.label)+'</button>';
  }
  var svgLines = nonHub.map(function(node,i){
    var angle = (i / n) * 2*Math.PI - Math.PI/2;
    var x2 = 50 + (R*Math.cos(angle))/6.4, y2 = 50 + (R*Math.sin(angle))/3.6;
    return '<line x1="50%" y1="50%" x2="'+x2+'%" y2="'+y2+'%"></line>';
  }).join("");

  var logHtml = data.edges.map(function(e){
    return '<div class="log-row"><div class="log-text">'+esc(e.source)+' — '+esc(e.target)+'</div><div class="log-w">×'+e.weight+'</div></div>';
  }).join("") || '<div class="empty">Aucun agencement</div>';

  return '<div class="screen map">'+
    '<div class="blueprint map-canvas">'+CORNERS+
      '<div class="map-search"><input id="mapInput" placeholder="chercher un concept…" value="'+conceptVal+'">'+
      '<button data-action="map-go">EXPLORER</button></div>'+
      '<svg width="100%" height="100%" style="position:absolute;inset:0" stroke="#5d7893" stroke-width="1" fill="none">'+svgLines+'</svg>'+
      nodesHtml+
      '<div class="map-legend">— épaisseur non représentée : voir le poids dans le panneau · cliquez un nœud pour recentrer</div>'+
    '</div>'+
    '<div class="map-side">'+
      '<div><div class="eyebrow">Topologie</div><div class="title-md">'+esc(hub)+'</div>'+
      '<div class="meta">'+data.mention_count+' mentions · '+nonHub.length+' voisins</div></div>'+
      '<div class="map-log">'+logHtml+'</div>'+
      '<div class="map-actions">'+
        '<button class="btn-outline" data-action="save-topo">Enregistrer</button>'+
        '<button class="btn-primary" data-action="nav:search">Chercher un fragment</button>'+
      '</div>'+
    '</div></div>';
}

function highlightExcerpt(text, q){
  if (!q) return esc(text);
  try{
    var words = q.trim().split(/\s+/).filter(Boolean).map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
    if (!words.length) return esc(text);
    var re = new RegExp("("+words.join("|")+")", "ig");
    return esc(text).replace(re, "<em>$1</em>");
  }catch(e){ return esc(text); }
}

function screenSearch(){
  var q = esc(state.searchQuery);
  var body;
  if (state.searchResults === null){
    body = '<div class="empty">Tapez une recherche, ou dites « cherche… ».</div>';
  } else if (!state.searchResults.length){
    body = '<div class="empty">Aucun résultat pour « '+q+' ».</div>';
  } else {
    body = state.searchResults.map(function(r){
      return '<button class="result-row" data-action="open-result:'+r.id+':'+r.idConf+'">'+
        '<span class="result-tc">'+r.timecode+'</span>'+
        '<span class="result-body"><span class="result-course">'+esc(r.conf_theme)+'</span>'+
        '<span class="result-excerpt">'+highlightExcerpt(r.texte.trim().slice(0,220), state.searchQuery)+'…</span></span>'+
        '</button>';
    }).join("");
  }
  return '<div class="screen search">'+
    '<form class="search-bar" id="searchForm">'+
      svgIcon("search").replace('stroke="currentColor"','stroke="#8fa0b0"')+
      '<input id="searchInput" type="search" autocomplete="off" placeholder="rechercher dans les transcriptions…" value="'+q+'">'+
      '<button type="submit">CHERCHER</button>'+
    '</form>'+
    '<div class="search-count">'+(state.searchResults ? state.searchTotal+' fragments · plein texte' : '&nbsp;')+'</div>'+
    '<div class="search-results">'+body+'</div>'+
  '</div>';
}

function screenPlayer(){
  var frag = currentFragment();
  if (!frag){
    return '<div class="screen player"><div class="empty" style="padding:60px">Aucun fragment ouvert — choisissez un thème, une recherche, ou dites « ouvre… ».</div></div>';
  }
  var words = frag.texte.trim().split(/\s+/);
  var dur = audioEl.duration || 0;
  var cur = audioEl.currentTime || 0;
  var progIdx = dur ? Math.floor((cur/dur) * words.length) : 0;
  var wordsHtml = words.map(function(w,i){
    var cls = i===progIdx ? "active" : (i<progIdx ? "past" : "future");
    return '<span class="word '+cls+'">'+esc(w)+' </span>';
  }).join("");
  var progPct = dur ? Math.round((cur/dur)*100) : 0;
  var seance = state.seance;
  var hasPrev = state.fragIndex > 0;
  var hasNext = seance && state.fragIndex < seance.fragments.length-1;

  return '<div class="screen player">'+
    '<div class="player-title-row"><div class="title-md">'+esc(seance?seance.theme:"")+'</div>'+
      '<div class="meta">'+esc(seance?seance.titre:"")+' · fragment '+(state.fragIndex+1)+' / '+(seance?seance.fragments.length:1)+'</div></div>'+
    '<div class="blueprint transcript">'+CORNERS+'<div class="transcript-text">'+wordsHtml+'</div></div>'+
    '<div class="progress" id="progressBar"><div class="progress-fill" style="width:'+progPct+'%"></div></div>'+
    '<div class="player-controls">'+
      '<span class="player-clock">'+fmtClock(cur)+' / '+fmtClock(dur)+'</span>'+
      '<div class="transport">'+
        '<button class="transport-btn" data-action="prev" '+(hasPrev?'':'disabled')+'>⏮</button>'+
        '<button class="play-btn" data-action="toggle">'+(state.playing?'PAUSE':'LIRE')+'</button>'+
        '<button class="transport-btn" data-action="next" '+(hasNext?'':'disabled')+'>⏭</button>'+
      '</div>'+
      '<div class="side-actions">'+
        '<button class="side-btn" data-action="frag-topology">concepts</button>'+
      '</div>'+
    '</div></div>';
}

function screenHistory(){
  var topoHtml = state.topos.length
    ? state.topos.map(function(t){
        return '<button class="topo-row" data-action="open-topo:'+encodeURIComponent(t.concept)+'">'+
          '<span class="topo-name">'+esc(t.concept)+'</span>'+
          '<span class="topo-meta">'+t.nodeCount+' concepts · enregistrée '+esc(t.when)+'</span></button>';
      }).join("")
    : '<div class="empty">Aucune topologie enregistrée</div>';
  var recentHtml = state.recent.length
    ? state.recent.map(function(r){
        return '<button class="recent-row" data-action="open-recent:'+r.id+':'+r.idConf+'">'+
          '<span class="recent-tc">'+esc(r.timecode||"")+'</span>'+
          '<span class="recent-course">'+esc(r.conf_theme)+' — '+esc(r.conf_titre)+'</span>'+
          '<span class="recent-when">'+esc(r.when)+'</span></button>';
      }).join("")
    : '<div class="empty">Aucun fragment écouté</div>';
  return '<div class="screen history">'+
    '<div class="history-col"><div class="eyebrow">Topologies enregistrées</div><div class="topo-list">'+topoHtml+'</div></div>'+
    '<div class="history-col"><div class="eyebrow">Derniers fragments écoutés</div><div class="recent-list">'+recentHtml+'</div></div>'+
    '</div>';
}

function screenSettings(){
  var speechOk = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  var secure = window.isSecureContext;
  var rows = [
    {label:"Serveur", hint:"origine servant l'app et l'API", val: location.host},
    {label:"État API", hint:"/api/health", val: state.apiOk===true?"connectée":state.apiOk===false?"hors-ligne":"…"},
    {label:"Reconnaissance vocale", hint: speechOk ? (secure?"disponible":"disponible, mais contexte non sécurisé — le navigateur peut la bloquer") : "non supportée par ce navigateur", val: speechOk && secure ? "prête" : "limitée"},
    {label:"Concepts composés", hint:"machine de guerre, plan d'immanence… minés depuis le corpus", val:"actif"},
    {label:"Historique & topologies", hint:"stockés sur cet appareil (localStorage), pas de compte", val: state.recent.length+" fragment(s) · "+state.topos.length+" topologie(s)"},
  ];
  return '<div class="screen settings">'+rows.map(function(r){
    return '<div class="setting-row"><span class="setting-text"><span class="setting-label">'+esc(r.label)+'</span>'+
      '<span class="setting-hint">'+esc(r.hint)+'</span></span>'+
      '<span class="setting-val">'+esc(r.val)+'</span></div>';
  }).join("")+'</div>';
}

var SCREENS = {home:screenHome, detail:screenDetail, map:screenMap, search:screenSearch,
  player:screenPlayer, history:screenHistory, settings:screenSettings};

function renderMain(){
  document.getElementById("main").innerHTML = SCREENS[state.screen]();
  if (state.screen === "map"){
    var inp = document.getElementById("mapInput");
    if (inp) inp.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); doMapSearch(); }});
  }
  if (state.screen === "search"){
    var form = document.getElementById("searchForm");
    if (form) form.addEventListener("submit", function(e){ e.preventDefault(); doSearch(document.getElementById("searchInput").value); });
  }
  if (state.screen === "player"){
    var bar = document.getElementById("progressBar");
    if (bar) bar.addEventListener("click", function(e){
      var rect = bar.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      if (audioEl.duration) audioEl.currentTime = pct * audioEl.duration;
    });
  }
}

function renderFooter(){
  var speechOk = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  var on = state.listening > 0;
  document.getElementById("micState").textContent = on ? "Écoute" : (speechOk ? "Voix prête" : "Voix indisponible");
  document.getElementById("micHint").textContent = on ? "…" : (speechOk ? "Dites « ouvre… », « cherche… » ou « agence X avec Y »" : "Utilisez la recherche ou la carte");
  document.getElementById("micBtn").classList.toggle("listening", on);
  document.getElementById("micBtn").classList.toggle("unsupported", !speechOk);
  var bars = "";
  for (var i=0;i<9;i++){ bars += '<span class="vbar'+(on?' on':'')+'" style="animation-delay:'+(i*0.11)+'s"></span>'; }
  document.getElementById("vbars").innerHTML = bars;
}

function renderOverlay(){
  var el = document.getElementById("listenOverlay");
  el.classList.toggle("show", state.listening > 0);
  if (state.listening === 0) return;
  var bars = "";
  for (var i=0;i<13;i++){ bars += '<span class="listen-bar" style="animation-delay:'+(i*0.07)+'s"></span>'; }
  document.getElementById("listenBars").innerHTML = bars;
  document.getElementById("listenLabel").textContent = state.listening === 1 ? "Écoute…" : "Compris";
  document.getElementById("listenHeard").textContent = state.heardText || (state.listening===1 ? "Parlez" : "…");
}

function render(){
  renderRail();
  renderHeader();
  renderMain();
  renderFooter();
  renderOverlay();
}

// ---------- navigation / actions ----------
function go(screen){ state.screen = screen; render(); }

async function openTheme(theme){
  state.currentTheme = theme;
  state.screen = "detail";
  state.seances = [];
  render();
  try{
    state.seances = await api("/api/themes/"+encodeURIComponent(theme)+"/seances");
  }catch(e){ state.seances = []; }
  render();
}

async function openSeance(id, fragId){
  try{
    var s = await api("/api/seances/"+id);
    state.seance = s;
    state.fragIndex = fragId ? Math.max(0, s.fragments.findIndex(function(f){return f.id===fragId;})) : 0;
    state.screen = "player";
    render();
    loadCurrentAudio(true);
    recordRecent();
  }catch(e){
    state.screen = "player";
    render();
  }
}

function recordRecent(){
  var f = currentFragment();
  var s = state.seance;
  if (!f || !s) return;
  pushRecent({
    id: f.id, idConf: s.id, conf_theme: s.theme, conf_titre: s.titre,
    timecode: f.timecode, when: "à l'instant"
  });
}

function loadCurrentAudio(autoplay){
  var f = currentFragment();
  if (!f) return;
  audioEl.src = f.audio_url;
  audioEl.currentTime = 0;
  if (autoplay){
    audioEl.play().then(function(){ state.playing = true; render(); }).catch(function(){ state.playing = false; render(); });
  } else {
    render();
  }
}

async function doSearch(q){
  state.searchQuery = q;
  state.screen = "search";
  render();
  try{
    var res = await api("/api/search?q="+encodeURIComponent(q)+"&limit=20");
    state.searchResults = res.hits;
    state.searchTotal = res.estimatedTotalHits;
  }catch(e){
    state.searchResults = [];
    state.searchTotal = 0;
  }
  render();
}

async function loadTopology(concept){
  state.topologyConcept = concept;
  state.screen = "map";
  state.topology = null;
  render();
  try{
    state.topology = await api("/api/topology?concept="+encodeURIComponent(concept)+"&depth=1&fanout=7");
  }catch(e){ state.topology = null; }
  render();
}

function doMapSearch(){
  var v = document.getElementById("mapInput").value.trim();
  if (v) loadTopology(v);
}

document.getElementById("stage").addEventListener("click", function(ev){
  var t = ev.target.closest("[data-action]");
  if (!t) return;
  var action = t.getAttribute("data-action");
  var parts = action.split(":");
  switch(parts[0]){
    case "nav": go(parts[1]); break;
    case "open-theme": openTheme(decodeURIComponent(parts[1])); break;
    case "open-seance": openSeance(+parts[1]); break;
    case "open-result": openSeance(+parts[2], +parts[1]); break;
    case "open-recent": openSeance(+parts[2], +parts[1]); break;
    case "resume-recent": {
      var r = state.recent[0];
      if (r) openSeance(r.idConf, r.id);
      break;
    }
    case "map-go": doMapSearch(); break;
    case "map-recenter": loadTopology(decodeURIComponent(parts[1])); break;
    case "open-topo": loadTopology(decodeURIComponent(parts[1])); break;
    case "save-topo": {
      if (state.topology){
        pushTopo({concept: state.topologyConcept, nodeCount: state.topology.nodes.length, when: nowTime()});
        render();
      }
      break;
    }
    case "frag-topology": {
      var f = currentFragment();
      if (f && f.concepts && f.concepts.length) loadTopology(f.concepts[0]);
      break;
    }
    case "toggle": togglePlay(); break;
    case "prev": stepFragment(-1); break;
    case "next": stepFragment(1); break;
    case "mic": startVoice(); break;
  }
});

function togglePlay(){
  if (!currentFragment()) return;
  if (state.playing){ audioEl.pause(); } else { audioEl.play().catch(function(){}); }
}

function stepFragment(delta){
  var s = state.seance;
  if (!s) return;
  var ni = state.fragIndex + delta;
  if (ni < 0 || ni >= s.fragments.length) return;
  state.fragIndex = ni;
  loadCurrentAudio(true);
  recordRecent();
}

audioEl.addEventListener("play", function(){ state.playing = true; if (state.screen==="player") renderFooter(); });
audioEl.addEventListener("pause", function(){ state.playing = false; if (state.screen==="player") render(); });
audioEl.addEventListener("ended", function(){ stepFragment(1); });
audioEl.addEventListener("timeupdate", function(){
  if (state.screen === "player"){
    var main = document.getElementById("main");
    var fill = main.querySelector(".progress-fill");
    var dur = audioEl.duration||0, cur=audioEl.currentTime||0;
    if (fill) fill.style.width = (dur?Math.round((cur/dur)*100):0)+"%";
    var clock = main.querySelector(".player-clock");
    if (clock) clock.textContent = fmtClock(cur)+" / "+fmtClock(dur);
    var frag = currentFragment();
    if (frag){
      var words = frag.texte.trim().split(/\s+/);
      var idx = dur ? Math.floor((cur/dur)*words.length) : 0;
      var wordEls = main.querySelectorAll(".word");
      wordEls.forEach(function(el,i){
        var cls = i===idx?"active":(i<idx?"past":"future");
        if (!el.classList.contains(cls)){ el.className = "word "+cls; }
      });
    }
  }
});

// ---------- voix ----------
var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
var recognizer = null;

function parseCommand(text){
  var t = text.trim().toLowerCase();
  var agenceMatch = t.match(/^agence[sz]?\s+(.+?)\s+avec\s+(.+)$/);
  if (agenceMatch){ return {type:"agence", a: agenceMatch[1].trim(), b: agenceMatch[2].trim()}; }
  var ouvreMatch = t.match(/^ouvre[sz]?\s+(.+)$/);
  if (ouvreMatch){ return {type:"ouvre", q: ouvreMatch[1].trim()}; }
  var chercheMatch = t.match(/^(cherche|recherche)[sz]?\s+(.+)$/);
  if (chercheMatch){ return {type:"cherche", q: chercheMatch[2].trim()}; }
  return {type:"cherche", q: t};
}

async function runCommand(cmd){
  if (cmd.type === "cherche"){
    await doSearch(cmd.q);
  } else if (cmd.type === "ouvre"){
    var theme = state.themes.find(function(th){ return th.theme.toLowerCase().indexOf(cmd.q) !== -1; });
    if (theme) await openTheme(theme.theme); else await doSearch(cmd.q);
  } else if (cmd.type === "agence"){
    try{
      var ra = await api("/api/concepts/resolve?q="+encodeURIComponent(cmd.a)+"&limit=1");
      var rb = await api("/api/concepts/resolve?q="+encodeURIComponent(cmd.b)+"&limit=1");
      var labelA = ra[0] ? ra[0].label : cmd.a;
      var labelB = rb[0] ? rb[0].label : cmd.b;
      await loadTopology(labelA);
      state.topoExtra = {label: labelB};
      render();
    }catch(e){ await doSearch(cmd.a+" "+cmd.b); }
  }
}

function startVoice(){
  if (state.listening) return;
  if (!SpeechRecognitionCtor){
    state.listening = 1; state.heardText = "Reconnaissance vocale indisponible ici"; render();
    setTimeout(function(){ state.listening = 0; render(); }, 1800);
    return;
  }
  try{
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = "fr-FR";
    recognizer.interimResults = true;
    recognizer.maxAlternatives = 1;
    state.listening = 1; state.heardText = ""; render();

    recognizer.onresult = function(ev){
      var text = "";
      for (var i=ev.resultIndex; i<ev.results.length; i++){ text += ev.results[i][0].transcript; }
      state.heardText = text;
      if (ev.results[ev.results.length-1].isFinal){
        state.listening = 2; render();
        var cmd = parseCommand(text);
        runCommand(cmd).finally(function(){ state.listening = 0; render(); });
      } else {
        render();
      }
    };
    recognizer.onerror = function(){ state.listening = 0; state.heardText="Erreur micro / permission refusée"; render(); setTimeout(function(){render();},1200); };
    recognizer.onend = function(){ if (state.listening===1){ state.listening = 0; render(); } };
    recognizer.start();
  }catch(e){
    state.listening = 1; state.heardText = "Micro indisponible"; render();
    setTimeout(function(){ state.listening = 0; render(); }, 1500);
  }
}

// ---------- horloge + init ----------
setInterval(function(){ if (!state.listening) document.getElementById("clock").textContent = nowTime(); }, 15000);

function fit(){
  var stage = document.getElementById("stage");
  var s = Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();
render();

api("/api/health").then(function(){ state.apiOk = true; render(); return api("/api/themes"); })
  .then(function(themes){ state.themes = themes; render(); })
  .catch(function(){ state.apiOk = false; render(); });

})();
</script>
