<meta charset="utf-8">
<title>Flux Conceptuel Auto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0f1216;
  --panel-line:rgba(148,188,227,.16);
  --line-soft:rgba(148,188,227,.14);
  --line:rgba(148,188,227,.24);
  --line-strong:rgba(148,188,227,.4);
  --text:#e8ecf0;
  --text-dim:#8fa0b0;
  --label:#94bce3;
  --wire:#5d7893;
  --steel:#5980a6;
  --steel-hover:#749dc4;
  --steel-wash:rgba(148,188,227,.12);
  --gold:#e8c15a;
  --gold-wash:rgba(232,193,90,.1);
  --gold-wash-2:rgba(232,193,90,.22);
  --font-head:"Barlow Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--steel-hover);outline-offset:2px}
::selection{background:var(--gold-wash-2)}

.letterbox{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
.stage{
  position:absolute;top:50%;left:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%);transform-origin:center center;
  background:var(--bg);display:flex;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* rail */
.rail{flex:none;width:96px;background:#12171d;border-right:1px solid var(--panel-line);
  display:flex;flex-direction:column;align-items:stretch;padding:14px 0;gap:4px}
.rail-logo{height:34px;display:flex;align-items:center;justify-content:center;color:var(--gold);
  font:600 15px var(--font-head);letter-spacing:.14em}
.rail-btn{appearance:none;border:0;background:transparent;color:var(--text-dim);height:76px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;font:400 10px var(--font-body);letter-spacing:.06em}
.rail-btn.active{background:var(--steel-wash);color:var(--label)}
.rail-spacer{flex:1}

/* column */
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.header{flex:none;height:56px;display:flex;align-items:center;gap:18px;padding:0 26px;
  border-bottom:1px solid var(--panel-line);background:#12171d}
.crumb{font:600 17px var(--font-head);letter-spacing:.06em;color:var(--text);text-transform:uppercase}
.crumb-sub{font:400 13px var(--font-body);color:var(--text-dim)}
.header-fill{flex:1}
.header-meta{font:400 13px var(--font-body);color:var(--text-dim);white-space:nowrap}
.header-div{width:1px;height:18px;background:var(--line)}
.clock{font:600 17px var(--font-head);color:var(--text)}

.main{flex:1;min-height:0;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;animation:screenin .18s ease-out}
@keyframes screenin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

.eyebrow{font:600 11px var(--font-body);letter-spacing:.16em;color:var(--label);text-transform:uppercase}

/* blueprint corner marks */
.blueprint{position:relative}
.corner{position:absolute;width:11px;height:11px;
  background:linear-gradient(var(--wire),var(--wire)) 5px 0/1px 100% no-repeat,
    linear-gradient(var(--wire),var(--wire)) 0 5px/100% 1px no-repeat}
.corner.tl{top:-6px;left:-6px}.corner.tr{top:-6px;right:-6px}
.corner.bl{bottom:-6px;left:-6px}.corner.br{bottom:-6px;right:-6px}

/* buttons */
.btn-primary{appearance:none;border:0;background:var(--steel);color:#0f1216;cursor:pointer;
  font:600 20px var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.btn-primary:hover,.btn-primary:active{background:var(--steel-hover)}
.btn-outline{appearance:none;background:transparent;border:1px solid var(--line-strong);color:#cfe0ef;
  cursor:pointer;font:600 15px var(--font-head);letter-spacing:.1em;text-transform:uppercase}
.btn-outline:hover,.btn-outline:active{background:var(--steel-wash)}
.btn-ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--text-dim);
  cursor:pointer;font:400 14px var(--font-body)}
.btn-ghost:hover,.btn-ghost:active{background:rgba(148,188,227,.1)}

/* home */
.home{position:absolute;inset:0;display:flex;gap:26px;padding:26px 26px 0}
.home-left{flex:none;width:452px;display:flex;flex-direction:column;gap:20px}
.resume-card{border:1px solid var(--line);padding:24px 22px 22px}
.title-lg{font:600 34px/1.05 var(--font-head);color:var(--text);margin:10px 0 6px;text-wrap:balance}
.meta{font:400 16px var(--font-body);color:var(--text-dim)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.tag{font:400 13px var(--font-body);color:#cfe0ef;border:1px solid var(--line-strong);padding:5px 10px}
.resume-card .btn-primary{width:100%;height:64px}
.topo-card{border:1px solid var(--line);padding:18px 20px}
.title-md{font:600 26px/1.1 var(--font-head);color:var(--text);margin:12px 0 0}
.topo-card .meta{margin-top:6px;font-size:15px}
.topo-card .btn-outline{margin-top:14px;height:52px;padding:0 20px}
.home-right{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:6px}
.home-right>.eyebrow{margin-bottom:12px}
.course-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.course-row{appearance:none;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line-soft);padding:16px 14px;display:flex;align-items:center;
  gap:16px;cursor:pointer}
.course-row:hover,.course-row:active{background:rgba(148,188,227,.08)}
.course-n{font:600 14px var(--font-head);color:var(--wire);width:26px;flex:none}
.course-info{flex:1;min-width:0;text-align:left}
.course-theme{display:block;font:600 25px/1.1 var(--font-head);color:var(--text)}
.course-meta{display:block;font:400 14px var(--font-body);color:var(--text-dim);margin-top:3px}
.chevron{font:400 22px var(--font-body);color:var(--wire);flex:none}

/* detail */
.detail{position:absolute;inset:0;padding:26px;display:flex;gap:26px}
.detail-left{flex:1;min-width:0}
.btn-back{height:44px;padding:0 16px}
.title-xl{font:600 52px/1 var(--font-head);color:var(--text);margin:22px 0 8px;text-wrap:balance}
.detail-left>.meta{font-size:17px}
.stat-row{display:flex;gap:0;margin:28px 0 26px;border:1px solid var(--line)}
.stat{flex:1;padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat-n{font:600 34px var(--font-head);color:var(--text);font-variant-numeric:tabular-nums}
.stat-l{font:400 12px var(--font-body);letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase}
.btn-row{display:flex;gap:12px}
.btn-row .btn-primary{height:64px;padding:0 34px}
.btn-row .btn-outline{height:64px;padding:0 26px;font-size:17px}
.detail-right{flex:none;width:392px;border-left:1px solid var(--panel-line);padding-left:24px;
  display:flex;flex-direction:column}
.detail-right>.eyebrow{margin-bottom:12px}
.seance-list{flex:1;min-height:0;overflow:auto}
.seance-row{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.seance-n{font:600 15px var(--font-head);color:var(--wire);width:24px;flex:none}
.seance-date{flex:1;font:400 16px var(--font-body);color:var(--text)}
.seance-frag{font:400 14px var(--font-body);color:var(--text-dim)}

/* map */
.map{position:absolute;inset:0;display:flex}
.map-canvas{flex:1;min-width:0;position:relative;margin:26px 0 26px 26px;border:1px solid var(--line);
  background:radial-gradient(circle at 46% 44%,rgba(89,128,166,.18),transparent 62%)}
.map-node{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(148,188,227,.5);
  background:#12171d;padding:11px 15px;font:600 21px var(--font-head);color:var(--text);white-space:nowrap}
.map-node.new{border-color:var(--gold);background:#1d1a12;color:var(--gold);
  animation:pulse 2.4s ease-in-out 3}
@keyframes pulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.map-node.new{animation:none}}
.map-legend{position:absolute;left:16px;bottom:14px;font:400 12px var(--font-body);color:var(--wire);letter-spacing:.08em}
.map-side{flex:none;width:372px;padding:26px;display:flex;flex-direction:column;gap:16px}
.map-side .title-md{font-size:36px;margin-top:8px}
.map-side .meta{margin-top:5px;font-size:15px}
.map-log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.log-row{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.log-text{font:400 15px/1.4 var(--font-body);color:var(--text)}
.log-src{font:400 12px var(--font-body);color:var(--wire);margin-top:4px;letter-spacing:.06em}
.map-actions{display:flex;gap:10px}
.map-actions button{flex:1;height:56px;font-size:15px}

/* search */
.search{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;gap:18px}
.search-bar{display:flex;align-items:center;gap:16px;border:1px solid var(--line-strong);padding:0 20px;height:72px}
.search-bar svg{flex:none}
.search-query{flex:1;font:400 26px var(--font-body);color:var(--text)}
.search-dicte{font:400 13px var(--font-body);color:var(--gold);letter-spacing:.1em}
.search-count{font:400 14px var(--font-body);color:var(--text-dim)}
.search-results{flex:1;min-height:0;overflow:auto}
.result-row{appearance:none;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line-soft);padding:16px 12px;display:flex;gap:18px;
  align-items:flex-start;cursor:pointer}
.result-row:hover,.result-row:active{background:rgba(148,188,227,.08)}
.result-tc{flex:none;width:78px;font:600 15px var(--font-head);color:var(--gold);letter-spacing:.06em;padding-top:3px;font-variant-numeric:tabular-nums}
.result-body{flex:1;min-width:0;text-align:left}
.result-course{display:block;font:600 20px var(--font-head);color:var(--label)}
.result-excerpt{display:block;font:400 16px/1.45 var(--font-body);color:#cfe0ef;margin-top:4px}
.result-score{flex:none;width:96px;padding-top:8px}
.result-score-track{display:block;height:4px;background:rgba(148,188,227,.2)}
.result-score-fill{display:block;height:4px;background:var(--steel)}

/* player */
.player{position:absolute;inset:0;display:flex;flex-direction:column;padding:26px}
.player-title-row{display:flex;align-items:baseline;gap:14px}
.player-title-row .title-md{margin:0;font-size:30px}
.player-title-row .meta{font-size:15px}
.transcript{position:relative;flex:1;min-height:0;margin:20px 0 22px;border:1px solid var(--line);
  padding:32px 34px;overflow:hidden}
.transcript-text{font:400 34px/1.5 var(--font-body);color:#7c8b99;text-wrap:pretty}
.word{transition:color .15s}
.word.future{color:#7c8b99}
.word.active{color:var(--gold)}
.word.past{color:var(--text)}
.progress{height:4px;background:rgba(148,188,227,.2);position:relative}
.progress-fill{height:4px;background:var(--gold)}
.player-controls{display:flex;align-items:center;gap:26px;margin-top:18px}
.player-clock{font:400 15px var(--font-body);color:var(--text-dim);width:120px;font-variant-numeric:tabular-nums}
.transport{flex:1;display:flex;justify-content:center;gap:14px}
.transport-btn{appearance:none;width:64px;height:64px;border:1px solid var(--line-strong);background:transparent;
  color:#cfe0ef;font:400 20px var(--font-body);cursor:pointer}
.transport-btn:hover,.transport-btn:active{background:var(--steel-wash)}
.play-btn{appearance:none;width:88px;height:64px;border:0;background:var(--steel);color:#0f1216;
  font:600 20px var(--font-head);letter-spacing:.08em;cursor:pointer}
.play-btn:hover,.play-btn:active{background:var(--steel-hover)}
.side-actions{width:220px;display:flex;justify-content:flex-end;gap:10px}
.side-btn{appearance:none;width:56px;height:56px;border:1px solid var(--line);background:transparent;
  color:var(--text-dim);font:400 15px var(--font-body);cursor:pointer}
.side-btn:hover,.side-btn:active{background:var(--steel-wash)}

/* history */
.history{position:absolute;inset:0;padding:26px;display:flex;gap:26px}
.history-col{flex:1;min-width:0;display:flex;flex-direction:column}
.history-col+.history-col{border-left:1px solid var(--panel-line);padding-left:24px}
.history-col>.eyebrow{margin-bottom:14px}
.topo-list{display:flex;flex-direction:column;gap:12px}
.topo-row{appearance:none;text-align:left;background:transparent;border:1px solid var(--line);
  padding:16px 18px;cursor:pointer}
.topo-row:hover,.topo-row:active{background:rgba(148,188,227,.08)}
.topo-name{display:block;font:600 26px var(--font-head);color:var(--text)}
.topo-meta{display:block;font:400 14px var(--font-body);color:var(--text-dim);margin-top:4px}
.recent-list{flex:1;min-height:0;overflow:auto}
.recent-row{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.recent-tc{flex:none;width:78px;font:600 14px var(--font-head);color:var(--wire);font-variant-numeric:tabular-nums}
.recent-course{flex:1;font:400 16px var(--font-body);color:var(--text)}
.recent-when{font:400 14px var(--font-body);color:var(--text-dim)}

/* settings */
.settings{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;gap:2px;max-width:820px}
.setting-row{display:flex;align-items:center;gap:20px;padding:20px 4px;border-bottom:1px solid var(--line-soft)}
.setting-text{flex:1}
.setting-label{display:block;font:600 24px var(--font-head);color:var(--text)}
.setting-hint{display:block;font:400 14px var(--font-body);color:var(--text-dim);margin-top:2px}
.seg{flex:none;display:flex;border:1px solid var(--line-strong);cursor:pointer}
.seg-opt{padding:12px 18px;font:400 15px var(--font-body);color:var(--text-dim);appearance:none;background:transparent;border:0;cursor:pointer}
.seg-opt.active{color:#0f1216;background:var(--steel)}

/* footer */
.footer{flex:none;height:92px;border-top:1px solid var(--panel-line);background:#12171d;
  display:flex;align-items:center;gap:22px;padding:0 26px}
.mic-btn{appearance:none;flex:none;width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);
  background:var(--gold-wash);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic-btn:hover,.mic-btn.listening{background:var(--gold-wash-2)}
.mic-info{flex:1;min-width:0}
.mic-state{font:400 12px var(--font-body);letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase}
.mic-hint{font:400 20px var(--font-body);color:var(--text);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbars{flex:none;display:flex;align-items:flex-end;gap:4px;height:34px}
.vbar{width:4px;height:34px;background:#2c3945;transform-origin:bottom;animation:vbar 1.1s ease-in-out infinite}
.vbar.on{background:var(--gold)}
@keyframes vbar{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.vbar{animation:none;transform:scaleY(.6)}}

/* listen overlay */
.listen-overlay{position:absolute;inset:0;background:rgba(10,12,15,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:10}
.listen-overlay.show{display:flex}
.listen-bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.listen-bar{width:7px;height:110px;background:var(--gold);transform-origin:bottom;animation:vbar .95s ease-in-out infinite}
.listen-label{font:400 12px var(--font-body);letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase}
.listen-heard{max-width:900px;text-align:center;font:600 46px/1.18 var(--font-head);color:var(--text);text-wrap:pretty;padding:0 40px}
.listen-hint{font:400 17px var(--font-body);color:var(--wire)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important}}

.rotate-hint{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--text);
  flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px}
@media (orientation:portrait){.rotate-hint{display:flex}.letterbox{visibility:hidden}}
.rotate-icon{width:56px;height:56px;border:2px solid var(--wire);border-radius:6px;
  animation:rotphone 1.8s ease-in-out infinite}
@keyframes rotphone{0%,15%{transform:rotate(0deg)}45%,100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.rotate-icon{animation:none}}
.rotate-title{font:600 22px var(--font-head);letter-spacing:.06em;color:var(--text);text-transform:uppercase}
.rotate-sub{font:400 15px/1.5 var(--font-body);color:var(--text-dim);max-width:320px}
</style>

<div class="rotate-hint">
  <div class="rotate-icon"></div>
  <div class="rotate-title">Tournez le téléphone</div>
  <div class="rotate-sub">Flux Conceptuel Auto est conçu pour l'écran large de la voiture, en orientation paysage.</div>
</div>
<div class="letterbox">
  <div class="stage" id="stage">
    <nav class="rail" id="rail">
      <div class="rail-logo">FC</div>
    </nav>
    <div class="col">
      <header class="header">
        <span class="crumb" id="crumb"></span>
        <span class="crumb-sub" id="crumbSub"></span>
        <div class="header-fill"></div>
        <span class="header-meta">Pixel de Samuel · connecté</span>
        <span class="header-div"></span>
        <span class="header-meta">21°C</span>
        <span class="clock" id="clock"></span>
      </header>
      <main class="main" id="main"></main>
      <footer class="footer">
        <button class="mic-btn" id="micBtn" data-action="mic" aria-label="Parler">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
        </button>
        <div class="mic-info">
          <div class="mic-state" id="micState"></div>
          <div class="mic-hint" id="micHint"></div>
        </div>
        <div class="vbars" id="vbars"></div>
      </footer>
    </div>
    <div class="listen-overlay" id="listenOverlay">
      <div class="listen-bars" id="listenBars"></div>
      <div class="listen-label" id="listenLabel"></div>
      <div class="listen-heard" id="listenHeard"></div>
      <div class="listen-hint">« agence X avec Y » · « ouvre Spinoza 07 » · « cherche machine de guerre »</div>
    </div>
  </div>
</div>

<script>

"use strict";

var CORNERS = '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad2(n){return String(n).padStart(2,"0");}

var COURSES = [
  {theme:"Appareils d'État et machines de guerre", years:"1979-1980", cours:13, frags:1395, concepts:"22 583"},

  {theme:"Sur la peinture", years:"1980-1981", cours:8, frags:1033, concepts:"14 822"},
  {theme:"Sur Leibniz", years:"1979-1980", cours:5, frags:743, concepts:"9 877"},
  {theme:"L'image-mouvement et l'image-temps", years:"1981-1982", cours:13, frags:1786, concepts:"26 118"},
  {theme:"Classification des signes et du temps", years:"1982-1983", cours:8, frags:1438, concepts:"16 656"},
  {theme:"Anti-Oedipe et autres réflexions", years:"1979-1980", cours:2, frags:223, concepts:"3 902"}
];
var SEANCES = [
  {n:"01", date:"2 décembre 1980", frag:150},{n:"02", date:"9 décembre 1980", frag:150},
  {n:"03", date:"16 décembre 1980", frag:150},{n:"04", date:"6 janvier 1981", frag:175},
  {n:"05", date:"13 janvier 1981", frag:87},{n:"06", date:"20 janvier 1981", frag:160},
  {n:"07", date:"27 janvier 1981", frag:154},{n:"08", date:"3 février 1981", frag:156},
  {n:"09", date:"10 février 1981", frag:145},{n:"10", date:"17 février 1981", frag:114}
];
var TEXT = "Cette année, j'ai plusieurs choses à vous proposer, et la première, c'est un très long détour du côté de ce que j'appellerai, si vous voulez bien, l'appareil d'État.";

function nowTime(){
  var d = new Date();
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function svgIcon(name){
  return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+ICONS[name]+'</svg>';
}

function renderRail(){
  var active = state.screen === "detail" ? "home" : state.screen;
  var html = '<div class="rail-logo">FC</div>';
  RAIL.forEach(function(r){
    html += '<button class="rail-btn'+(active===r[0]?' active':'')+'" data-action="nav:'+r[0]+'">'+svgIcon(r[0])+'<span>'+r[1]+'</span></button>';
  });
  html += '<div class="rail-spacer"></div>';
  html += '<button class="rail-btn'+(active==="settings"?' active':'')+'" data-action="nav:settings">'+svgIcon("settings")+'<span>Réglages</span></button>';
  document.getElementById("rail").innerHTML = html;
}

function renderHeader(){
  var subs = {home:"168 cours · Gilles Deleuze · Paris 8", detail:state.sel.years, map:"Guerre & État",
    search:"plein texte", player:"Sur Spinoza — 07", history:"topologies & fragments", settings:"Flux Conceptuel Auto 1.0"};
  document.getElementById("crumb").textContent = TITLES[state.screen];
  document.getElementById("crumbSub").textContent = subs[state.screen];
  document.getElementById("clock").textContent = nowTime();
}

function courseRow(c,i){
  return '<button class="course-row" data-action="open:'+i+'">'+
    '<span class="course-n">'+pad2(i+1)+'</span>'+
    '<span class="course-info"><span class="course-theme">'+esc(c.theme)+'</span>'+
    '<span class="course-meta">'+c.cours+' cours · '+c.frags+' fragments · '+c.concepts+' concepts</span></span>'+
    '<span class="chevron">›</span></button>';
}

function screenHome(){
  var nodeCount = 5 + state.added.length, edgeCount = 6 + state.added.length;
  return '<div class="screen home">'+
    '<div class="home-left">'+
      '<div class="blueprint resume-card">'+CORNERS+
        '<div class="eyebrow">Reprendre · fragment 87 / 154</div>'+
        '<div class="title-lg">Sur Spinoza — 07</div>'+
        '<div class="meta">Cours du 27 janvier 1981 · Université Paris 8</div>'+

}

  return '<div class="screen detail">'+
    '<div class="detail-left">'+
      '<button class="btn-outline btn-back" data-action="nav:home">‹ Tous les thèmes</button>'+
      '<div class="title-xl">'+esc(sel.theme)+'</div>'+

      '<div class="stat-row">'+
        '<div class="stat"><div class="stat-n">'+sel.cours+'</div><div class="stat-l">cours</div></div>'+
        '<div class="stat"><div class="stat-n">'+sel.frags+'</div><div class="stat-l">fragments</div></div>'+
        '<div class="stat"><div class="stat-n">'+sel.concepts+'</div><div class="stat-l">concepts</div></div>'+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn-primary" data-action="resume">Écouter</button>'+
        '<button class="btn-outline" data-action="nav:map">Agencer à la topologie</button>'+
      '</div>'+
    '</div>'+
    '<div class="detail-right"><div class="eyebrow">Séances</div>'+
      '<div class="seance-list">'+SEANCES.map(function(s){
        return '<div class="seance-row"><span class="seance-n">'+s.n+'</span>'+
          '<span class="seance-date">'+s.date+'</span><span class="seance-frag">'+s.frag+' fr.</span></div>';
      }).join("")+'</div>'+
    '</div></div>';
}

function screenMap(){
  var nodeCount = 5 + state.added.length, edgeCount = 6 + state.added.length;
  var lines = BASE_EDGES.map(function(e){
    return '<line x1="'+e.x1+'%" y1="'+e.y1+'%" x2="'+e.x2+'%" y2="'+e.y2+'%"'+(e.dash?' stroke-dasharray="4 5"':'')+'></line>';
  }).join("");
  state.added.forEach(function(n){
    lines += '<line x1="'+n.fx+'%" y1="'+n.fy+'%" x2="'+n.x+'%" y2="'+n.y+'%" stroke="#e8c15a"></line>';
  });
  var nodes = BASE_NODES.map(function(n){
    return '<div class="map-node" style="left:'+n.x+'%;top:'+n.y+'%">'+esc(n.label)+'</div>';
  }).join("");
  state.added.forEach(function(n){
    nodes += '<div class="map-node new" style="left:'+n.x+'%;top:'+n.y+'%">'+esc(n.label)+'</div>';
  });
  return '<div class="screen map">'+
    '<div class="blueprint map-canvas">'+CORNERS+
      '<svg width="100%" height="100%" style="position:absolute;inset:0" stroke="#5d7893" stroke-width="1" fill="none">'+lines+'</svg>'+
      nodes+
      '<div class="map-legend">— trait plein : agencement dit à voix haute · pointillé : proposé par le corpus</div>'+
    '</div>'+
    '<div class="map-side">'+
      '<div><div class="eyebrow">Topologie</div><div class="title-md">Guerre &amp; État</div>'+
      '<div class="meta">'+nodeCount+' concepts · '+edgeCount+' agencements</div></div>'+
      '<div class="map-log">'+state.log.map(function(l){
        return '<div class="log-row"><div class="log-text">'+esc(l.text)+'</div><div class="log-src">'+esc(l.src)+'</div></div>';
      }).join("")+'</div>'+
      '<div class="map-actions">'+
        '<button class="btn-outline" data-action="nav:history">Enregistrer</button>'+
        '<button class="btn-primary" data-action="resume">Écouter le flux</button>'+
      '</div>'+
    '</div></div>';
}

function screenSearch(){
  return '<div class="screen search">'+
    '<div class="search-bar">'+svgIcon("search").replace('stroke="currentColor"','stroke="#8fa0b0"')+
      '<span class="search-query">machine de guerre</span><span class="search-dicte">DICTÉ</span></div>'+
    '<div class="search-count">128 fragments · plein texte dans les transcriptions</div>'+
    '<div class="search-results">'+RESULTS.map(function(r){
      return '<button class="result-row" data-action="resume"><span class="result-tc">'+r.tc+'</span>'+
        '<span class="result-body"><span class="result-course">'+esc(r.course)+'</span>'+
        '<span class="result-excerpt">'+esc(r.excerpt)+'</span></span>'+
        '<span class="result-score"><span class="result-score-track"><span class="result-score-fill" style="width:'+r.score+'%"></span></span></span></button>';
    }).join("")+'</div></div>';
}

function screenPlayer(){
  var cur = Math.floor(state.t/50*WORDS.length);
  var words = WORDS.map(function(w,i){
    var cls = i===cur ? "active" : (i<cur ? "past" : "future");
    return '<span class="word '+cls+'">'+esc(w)+' </span>';
  }).join("");
  var progPct = Math.round(state.t/50*100);
  var mm = Math.floor(state.t);
  return '<div class="screen player">'+
    '<div class="player-title-row"><div class="title-md">Sur Spinoza — 07</div>'+
      '<div class="meta">27 janvier 1981 · fragment 87 / 154</div></div>'+
    '<div class="blueprint transcript">'+CORNERS+'<div class="transcript-text">'+words+'</div></div>'+
    '<div class="progress"><div class="progress-fill" style="width:'+progPct+'%"></div></div>'+
    '<div class="player-controls">'+
      '<span class="player-clock">00:43:'+pad2(mm)+' / 00:44:02</span>'+
      '<div class="transport">'+
        '<button class="transport-btn" data-action="prev">⏮</button>'+
        '<button class="play-btn" data-action="toggle">'+(state.playing?'PAUSE':'LIRE')+'</button>'+
        '<button class="transport-btn" data-action="next">⏭</button>'+
      '</div>'+
      '<div class="side-actions">'+
        '<button class="side-btn">lien</button><button class="side-btn">part.</button><button class="side-btn">extr.</button>'+
      '</div>'+
    '</div></div>';
}

function screenHistory(){
  return '<div class="screen history">'+
    '<div class="history-col"><div class="eyebrow">Topologies enregistrées</div>'+
      '<div class="topo-list">'+TOPOS.map(function(t){
        return '<button class="topo-row" data-action="nav:map"><span class="topo-name">'+esc(t.name)+'</span>'+
          '<span class="topo-meta">'+esc(t.meta)+'</span></button>';
      }).join("")+'</div></div>'+
    '<div class="history-col"><div class="eyebrow">Derniers fragments écoutés</div>'+
      '<div class="recent-list">'+RECENT.map(function(r){
        return '<div class="recent-row"><span class="recent-tc">'+r.tc+'</span>'+
          '<span class="recent-course">'+esc(r.course)+'</span><span class="recent-when">'+r.when+'</span></div>';
      }).join("")+'</div></div>'+
    '</div>';
}

function screenSettings(){
  return '<div class="screen settings">'+SETTINGS.map(function(s,i){
    var sel = state.settingsSel[i];
    return '<div class="setting-row"><span class="setting-text"><span class="setting-label">'+esc(s.label)+'</span>'+
      '<span class="setting-hint">'+esc(s.hint)+'</span></span>'+
      '<span class="seg">'+
        '<button class="seg-opt'+(sel===0?' active':'')+'" data-action="setting:'+i+':0">'+esc(s.a)+'</button>'+
        '<button class="seg-opt'+(sel===1?' active':'')+'" data-action="setting:'+i+':1">'+esc(s.b)+'</button>'+
      '</span></div>';
  }).join("")+'</div>';
}

var SCREENS = {home:screenHome, detail:screenDetail, map:screenMap, search:screenSearch,
  player:screenPlayer, history:screenHistory, settings:screenSettings};

function renderMain(){
  document.getElementById("main").innerHTML = SCREENS[state.screen]();
}

function renderFooter(){
  var on = state.listening > 0;
  document.getElementById("micState").textContent = on ? "Écoute" : "Voix prête";
  document.getElementById("micHint").textContent = on ? "…" : "Dites « agence machine de guerre avec agencement collectif d'énonciation »";
  document.getElementById("micBtn").classList.toggle("listening", on);
  var bars = "";
  for (var i=0;i<9;i++){ bars += '<span class="vbar'+(on?' on':'')+'" style="animation-delay:'+(i*0.11)+'s"></span>'; }
  document.getElementById("vbars").innerHTML = bars;
}

function renderOverlay(){
  var el = document.getElementById("listenOverlay");
  el.classList.toggle("show", state.listening > 0);
  if (state.listening === 0) return;
  var bars = "";
  for (var i=0;i<13;i++){ bars += '<span class="listen-bar" style="animation-delay:'+(i*0.07)+'s"></span>'; }
  document.getElementById("listenBars").innerHTML = bars;
  var u = UTTERANCES[state.utter % UTTERANCES.length];
  document.getElementById("listenLabel").textContent = state.listening === 1 ? "Écoute…" : "Compris";
  document.getElementById("listenHeard").textContent = state.listening === 1 ? "Parlez" : u.heard;
}

function render(){
  renderRail();
  renderHeader();
  renderMain();
  renderFooter();
  renderOverlay();
}

function updatePlayerTick(){
  if (state.screen !== "player") return;
  var main = document.getElementById("main");
  var cur = Math.floor(state.t/50*WORDS.length);
  var wordEls = main.querySelectorAll(".word");
  wordEls.forEach(function(el,i){
    el.classList.remove("active","past","future");
    el.classList.add(i===cur ? "active" : (i<cur ? "past" : "future"));
  });
  var fill = main.querySelector(".progress-fill");
  if (fill) fill.style.width = Math.round(state.t/50*100)+"%";
  var clock = main.querySelector(".player-clock");
  if (clock) clock.textContent = "00:43:"+pad2(Math.floor(state.t))+" / 00:44:02";
}

function startVoice(){
  clearTimeout(state._a); clearTimeout(state._b);
  state.listening = 1;
  render();
  state._a = setTimeout(function(){ state.listening = 2; render(); }, 1500);
  state._b = setTimeout(function(){
    var u = UTTERANCES[state.utter % UTTERANCES.length];
    state.listening = 0;
    state.screen = "map";
    state.utter += 1;
    state.added.push({label:u.node, x:u.x, y:u.y, fx:u.fx, fy:u.fy});
    state.log.unshift({text:u.log, src:u.src+nowTime()});
    render();
  }, 3200);
}

document.getElementById("stage").addEventListener("click", function(ev){
  var t = ev.target.closest("[data-action]");
  if (!t) return;
  var action = t.getAttribute("data-action");
  var parts = action.split(":");
  switch(parts[0]){
    case "nav": state.screen = parts[1]; render(); break;
    case "open": state.screen = "detail"; state.sel = COURSES[+parts[1]]; render(); break;
    case "resume": state.screen = "player"; state.playing = true; render(); break;
    case "toggle": state.playing = !state.playing; render(); break;
    case "prev": state.t = 0; render(); break;
    case "next": state.t = Math.min(49.5, state.t + 5); render(); break;
    case "mic": startVoice(); break;
    case "setting": state.settingsSel[+parts[1]] = +parts[2]; render(); break;
  }
});

setInterval(function(){
  if (state.playing && state.screen === "player"){
    state.t = (state.t + 0.5) % 50;
    updatePlayerTick();
  }
}, 450);

setInterval(function(){
  if (state.listening === 0) document.getElementById("clock").textContent = nowTime();
}, 15000);

function fit(){
  var stage = document.getElementById("stage");
  var s = Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();
render();

})();
</script>
