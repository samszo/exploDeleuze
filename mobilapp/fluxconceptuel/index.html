<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Conceptuel — Cours de Gilles Deleuze</title>
<meta name="description" content="Explorer et écouter les cours de Gilles Deleuze enregistrés à l'université Paris 8.">
<meta name="theme-color" content="#14141a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/fontawesome.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="view-list" class="view">
  <header class="list-header">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <span aria-hidden="true" style="font-size:2rem;line-height:1;"><a href="https://paragraphe.univ-paris8.fr/" target="_blank"><img class="logo" src="./img/logo-paragraphe-blanc.svg" /></a></span>
      <div>
        <h1>Flux Conceptuel</h1>
        <p class="subtitle">Cours de Gilles Deleuze · Université Paris 8</p>
      </div>
      <span aria-hidden="true" style="font-size:2rem;line-height:1;"><a href="https://github.com/samszo/exploDeleuze/tree/main/mobilapp/fluxconceptuel" target="_blank"><img class="logo" src="./img/logo-github.png" /></a></span>
    </div>
    <form id="search-form" class="search-form">
      <input id="search" type="search" placeholder="Rechercher un cours, un thème…" autocomplete="off">
      <button type="submit" class="search-btn" aria-label="Rechercher">Rechercher</button>
    </form>

    <div id="auth-box" class="auth-box">
      <button id="btn-auth-toggle" class="auth-link">Se connecter à Omeka S</button>
      <form id="login-form" class="login-form hidden">
        <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
        <input id="login-identity" type="text" placeholder="Key identity" autocomplete="off" required>
        <input id="login-credential" type="password" placeholder="Key credential" autocomplete="current-password" required>
        <button type="submit" class="search-btn">Connexion</button>
        <p id="login-error" class="status error hidden"></p>
      </form>
      <div id="logged-in-box" class="logged-in-box hidden">
        <span id="logged-in-name"></span>
        <button id="btn-logout" class="auth-link">Se déconnecter</button>
      </div>
    </div>
  </header>
  <main id="course-groups" class="course-groups">
    <p class="status">Chargement des cours…</p>
  </main>
</div>

<div id="view-player" class="view hidden">
  <header class="player-header">
    <button id="btn-back" class="icon-btn" aria-label="Retour à la liste"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
    <div class="player-title">
      <h2 id="course-title">—</h2>
      <p id="course-meta" class="subtitle">—</p>
    </div>
  </header>

  <main class="player-main">
    <div id="captions" class="captions" aria-live="polite"></div>
  </main>

  <footer class="player-controls">
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <p id="fragment-counter" class="fragment-counter">—</p>
    <div class="buttons">
      <button id="btn-prev" class="icon-btn" aria-label="Fragment précédent"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
      <button id="btn-play" class="icon-btn play" aria-label="Lecture / Pause"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
      <button id="btn-next" class="icon-btn" aria-label="Fragment suivant"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
    </div>
    <div class="secondary-actions">
      <button id="btn-copy-ref" class="copy-ref-btn" aria-label="Copier la référence du fragment (lien BnF + horodatage)">
        <i class="fa-solid fa-link" aria-hidden="true"></i>
      </button>
      <button id="btn-share" class="copy-ref-btn" aria-label="Partager le lien vers ce fragment">
        <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
      </button>
    </div>

    <div id="collab-actions" class="secondary-actions hidden">
      <button id="btn-relancer" class="copy-ref-btn" data-report-type="relancer" aria-label="Relancer la transcription">
        <i class="fa-solid fa-rotate" aria-hidden="true"></i>
      </button>
      <button class="copy-ref-btn" data-report-type="correction" aria-label="Signaler une correction">
        <i class="fa-solid fa-pen" aria-hidden="true"></i>
      </button>
      <button class="copy-ref-btn" data-report-type="personne" aria-label="Référence à une personne">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
      </button>
      <button class="copy-ref-btn" data-report-type="oeuvre" aria-label="Référence à une œuvre">
        <i class="fa-solid fa-book" aria-hidden="true"></i>
      </button>
      <button class="copy-ref-btn" data-report-type="date" aria-label="Référence à une date ou une période">
        <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
      </button>
      <button class="copy-ref-btn" data-report-type="lieu" aria-label="Référence à un lieu">
        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
      </button>
    </div>

    <div id="report-panel" class="report-panel hidden">
      <p id="report-title" class="report-title"></p>

      <select id="report-modele" class="report-select hidden">
        <option value="whisper">Whisper</option>
        <option value="google">Google Speech-to-Text</option>
      </select>

      <textarea id="report-texte" class="report-textarea hidden" rows="3" placeholder="Décrivez la correction ou la référence…"></textarea>

      <div id="report-correction" class="report-correction hidden">
        <input id="report-remplacer" type="text" class="report-select" placeholder="Remplacer…" autocomplete="off">
        <input id="report-par" type="text" class="report-select" placeholder="Par…" autocomplete="off">
        <label class="report-checkbox">
          <input id="report-sur-tout" type="checkbox">
          Remplacer partout dans le cours
        </label>
      </div>

      <p id="report-error" class="status error hidden"></p>
      <div class="report-buttons">
        <button id="btn-report-cancel" class="icon-btn" aria-label="Annuler"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        <button id="btn-report-submit" class="search-btn" aria-label="Envoyer"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
      </div>
    </div>
  </footer>

  <audio id="audio" preload="auto"></audio>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
